name: Aggregate data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: [self-hosted, lab]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          token: ${{ secrets.BOT_PAT }}
          clean: true

      - name: Clear stale worktree state
        run: |
          git worktree prune
          rm -rf data-branch

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run aggregator
        env:
          ABUSECH_API_KEY: ${{ secrets.ABUSECH_API_KEY }}
        run: go run ./cmd/aggregate

      - name: Commit out/ to data branch
        run: |
          git config user.name "HoardCTI [bot]"
          git config user.email "admin@hoardcti.com"

          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data:refs/remotes/origin/data
            git worktree add --detach data-branch origin/data
          else
            git worktree add --orphan -b data data-branch
          fi

          rsync -a --exclude .git out/ data-branch/

          git -C data-branch add -A
          if git -C data-branch diff --cached --quiet; then
            echo "No data changes"
          else
            git -C data-branch commit -m "Update data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git -C data-branch push origin HEAD:data
          fi

      - name: Update stats.json
        run: |
          FILE_COUNT=$(git -C data-branch ls-files | wc -l)
          EPOCH=$(git -C data-branch log -1 --format=%ct HEAD)

          cat > stats.json <<EOF
          {
            "files": $FILE_COUNT,
            "files_display": "$(printf "%'d" "$FILE_COUNT")",
            "last_edit": "$(date -u -d "@$EPOCH" +%Y-%m-%dT%H:%M:%SZ)",
            "last_edit_display": "$(date -u -d "@$EPOCH" +"%-d %b %Y, %H:%M UTC")"
          }
          EOF

          git add stats.json
          if git diff --cached --quiet; then
            echo "No stats changes"
          else
            git commit -m "Update stats $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:main
          fi

      - name: Clean up worktree
        if: always()
        run: |
          git worktree remove --force data-branch || true
          git worktree prune
