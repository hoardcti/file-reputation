name: Aggregate data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *" 

permissions:
  contents: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true
          token: ${{ secrets.BOT_PAT }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Run aggregator
        env:
          ABUSECH_API_KEY: ${{ secrets.ABUSECH_API_KEY }}
        run: go run ./cmd/aggregate

      - name: Commit out/ to data branch
        run: |
          git config user.name "HoardCTI [bot]"
          git config user.email "admin@hoardcti.com"

          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data:refs/remotes/origin/data
            git worktree add --detach data-branch origin/data
          else
            git worktree add --orphan -b data data-branch
          fi

          rsync -a --exclude .git out/ data-branch/

          cd data-branch
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD:data