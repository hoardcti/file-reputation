name: Aggregate data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *" 

permissions:
  contents: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          token: ${{ secrets.BOT_PAT }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run aggregator
        env:
          ABUSECH_API_KEY: ${{ secrets.ABUSECH_API_KEY }}
        run: go run ./cmd/aggregate

      - name: Commit out/ to data branch
        run: |
          git config user.name "HoardCTI [bot]"
          git config user.email "admin@hoardcti.com"

          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data:refs/remotes/origin/data
            git worktree add --detach data-branch origin/data
          else
            git worktree add --orphan -b data data-branch
          fi

          rsync -a --exclude .git out/ data-branch/

          cd data-branch
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD:data

      - name: Update stats.json
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 --single-branch --branch data \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data-clone

          FILE_COUNT=$(git -C data-clone ls-tree -r --name-only HEAD | wc -l)
          FILE_COUNT_FMT=$(printf "%d" "$FILE_COUNT" | rev | sed 's/\([0-9]\{3\}\)/\1,/g' | rev | sed 's/,$//')
          EPOCH=$(git -C data-clone log -1 --format=%ct HEAD)
          LAST_EDIT=$(date -u -d "@$EPOCH" +"%-d %b %Y, %H:%M UTC")
          rm -rf data-clone

          cat > stats.json <<EOF
          {
              "files": "$FILE_COUNT_FMT",
              "last_edit": "$LAST_EDIT"
          }
          EOF

          git add stats.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update stats $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD:main